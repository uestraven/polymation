[project]
name = "polymation-studio"
version = "0.1.0"
description = "Internal media production platform for the Polymation video channel."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Polymation Studio" }]

dependencies = [
    "typer>=0.12,<0.18",
    "pydantic>=2.7,<3",
    "pillow>=10.3,<13",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "ruff>=0.5,<0.15",
]

[project.scripts]
polymation = "polymation.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polymation"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit
    "RUF", # ruff-specific
]
ignore = [
    "B008", # Typer relies on function-call defaults (typer.Option/Argument).
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # asserts are the point of a test suite

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "ffmpeg: requires a working local FFmpeg/ffprobe installation",
]
