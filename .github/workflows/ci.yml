name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test and render
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the pinned Python
        # Reads .python-version, so CI uses exactly the pinned interpreter.
        run: uv python install

      - name: Report the Python version in use
        run: uv run python -VV

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install project dependencies
        # --frozen when a lockfile is committed, so CI installs exactly the
        # locked versions; falls back to resolving when it is not.
        run: |
          if [ -f uv.lock ]; then
            uv sync --frozen --extra dev
          else
            echo "::warning title=No lockfile::uv.lock is absent; resolving dependencies instead of installing locked versions."
            uv sync --extra dev
          fi

      - name: Environment diagnostics
        run: uv run polymation doctor

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Tests
        # -m ffmpeg must actually run here: a skip would mean the rendering
        # acceptance criteria are unverified.
        run: uv run pytest -v --junitxml=pytest-report.xml

      - name: Fail if any FFmpeg integration test was skipped
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          suite = ET.parse("pytest-report.xml").getroot()
          skipped = [
              case.get("name")
              for case in suite.iter("testcase")
              if case.find("skipped") is not None
              and "ffmpeg" in (case.get("classname") or "") + (case.get("name") or "")
          ]
          if skipped:
              print("FFmpeg integration tests were skipped in CI:", *skipped, sep="\n  ")
              sys.exit(1)
          print("No FFmpeg integration tests were skipped.")
          PY

      - name: Build the technical demonstration
        run: uv run polymation demo create --recreate

      - name: Render the technical demonstration
        run: uv run polymation demo render --overwrite

      - name: Inspect the rendered media with ffprobe
        run: |
          OUTPUT=projects/demo-technical-fixture/output/demo-technical-fixture.mp4
          test -s "$OUTPUT" || { echo "::error::$OUTPUT is missing or empty"; exit 1; }
          ffprobe -v error -hide_banner -print_format json -show_format -show_streams "$OUTPUT"

      - name: Assert the output matches the M0.1 specification
        run: |
          OUTPUT=projects/demo-technical-fixture/output/demo-technical-fixture.mp4

          # One ffprobe call per field. Asking for several entries at once
          # returns them in ffprobe's own field order, not the order requested,
          # so a positional read would silently mix the values up.
          probe_stream() { # probe_stream <stream-selector> <field>
            ffprobe -v error -select_streams "$1" -show_entries "stream=$2" \
              -of default=nw=1:nk=1 "$OUTPUT" | head -n 1
          }

          WIDTH=$(probe_stream v:0 width)
          HEIGHT=$(probe_stream v:0 height)
          RATE=$(probe_stream v:0 r_frame_rate)
          VCODEC=$(probe_stream v:0 codec_name)
          PIXFMT=$(probe_stream v:0 pix_fmt)
          ACODEC=$(probe_stream a:0 codec_name)
          ARATE=$(probe_stream a:0 sample_rate)
          ACHANNELS=$(probe_stream a:0 channels)
          DURATION=$(ffprobe -v error -show_entries format=duration \
            -of default=nw=1:nk=1 "$OUTPUT" | head -n 1)

          echo "resolution=${WIDTH}x${HEIGHT} fps=${RATE} video=${VCODEC} pix_fmt=${PIXFMT}"
          echo "audio=${ACODEC} sample_rate=${ARATE} channels=${ACHANNELS}"
          echo "duration=${DURATION}"

          FAILED=0
          expect() { # expect <label> <actual> <wanted>
            if [ "$2" != "$3" ]; then
              echo "::error::$1 is '$2', expected '$3'"
              FAILED=1
            fi
          }

          expect width "$WIDTH" 1920
          expect height "$HEIGHT" 1080
          expect "frame rate" "$RATE" 30/1
          expect "video codec" "$VCODEC" h264
          expect "pixel format" "$PIXFMT" yuv420p
          expect "audio codec" "$ACODEC" aac
          expect "audio sample rate" "$ARATE" 48000
          expect "audio channels" "$ACHANNELS" 2

          awk -v d="$DURATION" 'BEGIN { exit !(d > 14.5 && d < 15.5) }' \
            || { echo "::error::duration is ${DURATION}s, expected about 15s"; FAILED=1; }

          if [ "$FAILED" -eq 0 ]; then
            echo "Output conforms to the M0.1 specification."
          fi
          exit $FAILED

      - name: Validate the demonstration project
        run: uv run polymation validate demo-technical-fixture --json

      - name: Upload the rendered demonstration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technical-demonstration
          path: |
            projects/demo-technical-fixture/output/*.mp4
            pytest-report.xml
          if-no-files-found: warn
          retention-days: 14
